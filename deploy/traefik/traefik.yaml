global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls: {}

# Routes live in a file rather than container labels, so Traefik needs no access to the
# Docker or Podman socket.
providers:
  file:
    filename: /etc/traefik/dynamic.yaml

log:
  level: INFO

accessLog: {}
