<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game of Life</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<main>
  <header>
    <h1>Game of Life</h1>
    <p class="stats"><span>Generation <strong id="generation">0</strong></span>
      <span>Population <strong id="population">0</strong></span></p>
  </header>

  <form id="setup">
    <label>Pattern
      <select id="pattern"></select>
    </label>
    <label>Width <input id="width" type="number" min="1" max="1000" value="120"></label>
    <label>Height <input id="height" type="number" min="1" max="1000" value="80"></label>
    <label>Edges
      <select id="topology">
        <option value="TOROIDAL">Wrap round</option>
        <option value="BOUNDED">Hard edges</option>
      </select>
    </label>
    <button type="submit">New board</button>
    <label class="custom" hidden>Pattern in RLE or as a list of [x, y] cells
      <textarea id="custom" rows="4" spellcheck="false">x = 3, y = 3, rule = B3/S23
bob$2bo$3o!</textarea>
    </label>
  </form>

  <div class="run">
    <button id="toggle" type="button" disabled>Start</button>
    <label>Speed <input id="speed" type="range" min="1" max="30" value="10">
      <output id="speed-value">10</output> per second</label>
  </div>

  <p id="message" role="status"></p>
  <canvas id="board" aria-label="The board"></canvas>
</main>
<script src="app.js"></script>
</body>
</html>
